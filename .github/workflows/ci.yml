name: CI

on: [push, pull_request]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    strategy:
      matrix:
        node: ["24.x"]
        platform: [ubuntu-latest]
    name: Node v${{matrix.node}} ((${{matrix.platform}}))
    runs-on: ${{matrix.platform}}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{matrix.node}}
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: lint code
        run: pnpm run lint
      - name: build project
        run: pnpm run build
      - name: run tests
        run: pnpm run test
      - name: coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: github.actor != 'dependabot[bot]'
        with:
          fail_ci_if_error: true
          verbose: false
          token: ${{ secrets.CODECOV_TOKEN }}
        env:
          CI: true

  image:
    name: Image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Check image-related paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "image=true" >> "${GITHUB_OUTPUT}"
          elif git diff --quiet "${BASE_SHA}" "${GITHUB_SHA}" -- \
            'assets/image/**' \
            'assets/devcontainer/**' \
            'scripts/**' \
            '__tests__/**' \
            'package.json' \
            'pnpm-lock.yaml' \
            '.github/workflows/**'; then
            echo "image=false" >> "${GITHUB_OUTPUT}"
          else
            echo "image=true" >> "${GITHUB_OUTPUT}"
          fi
      - if: steps.changes.outputs.image == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - if: steps.changes.outputs.image == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.changes.outputs.image == 'true'
        run: pnpm install --frozen-lockfile
      - name: Read package version
        if: steps.changes.outputs.image == 'true'
        id: package
        run: |
          version="$(node -p "require('./package.json').version")"
          tool_lock_sha256="$(sha256sum assets/image/tools.lock.json | cut -d' ' -f1)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tool_lock_sha256=${tool_lock_sha256}" >> "${GITHUB_OUTPUT}"
      - if: steps.changes.outputs.image == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - if: steps.changes.outputs.image == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build AMD64 image
        if: steps.changes.outputs.image == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: assets/image/Dockerfile
          platforms: linux/amd64
          load: true
          tags: boxdown-ci:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/lirantal/boxdown
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
            io.boxdown.tools-lock.sha256=${{ steps.package.outputs.tool_lock_sha256 }}
          provenance: false
          sbom: false
      - name: Smoke-test AMD64 image as node
        if: steps.changes.outputs.image == 'true'
        run: >-
          docker run --rm --user node
          boxdown-ci:${{ github.sha }}
          /opt/boxdown/image-tools/smoke-test.sh
      - name: Verify Docker quoted mount grammar
        if: steps.changes.outputs.image == 'true'
        run: >-
          docker run --rm
          --mount 'type=tmpfs,"dst=/tmp/boxdown ""quoted"",mount"'
          boxdown-ci:${{ github.sha }}
          test -d '/tmp/boxdown "quoted",mount'
      - name: Smoke-test non-root lifecycle and SSH bootstrap
        if: steps.changes.outputs.image == 'true'
        run: >-
          docker run --rm --user root
          --mount type=bind,source="${GITHUB_WORKSPACE}/assets/devcontainer",target=/opt/boxdown/devcontainer,readonly
          boxdown-ci:${{ github.sha }}
          /opt/boxdown/image-tools/lifecycle-smoke-test.sh --remap-node
      - name: Export dual-platform OCI image
        if: steps.changes.outputs.image == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: assets/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/boxdown-oci,tar=false
          labels: |
            org.opencontainers.image.source=https://github.com/lirantal/boxdown
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
            io.boxdown.tools-lock.sha256=${{ steps.package.outputs.tool_lock_sha256 }}
          provenance: false
          sbom: false
      - name: Validate dual-platform OCI image
        if: steps.changes.outputs.image == 'true'
        run: >-
          node --import tsx scripts/verify-image-manifest.ts
          oci-layout "${{ runner.temp }}/boxdown-oci"
          assets/image/image-size-budget.json
          "${{ github.sha }}"
          "${{ steps.package.outputs.version }}"
          "${{ steps.package.outputs.tool_lock_sha256 }}"
